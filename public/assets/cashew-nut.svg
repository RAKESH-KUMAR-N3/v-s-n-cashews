<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cashewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="35%" stop-color="#FCE4A6" />
      <stop offset="70%" stop-color="#E8BA64" />
      <stop offset="100%" stop-color="#C58F33" />
    </linearGradient>
    <linearGradient id="cashewHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFF3D1" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cashewShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8C5C12" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8C5C12" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Real C-Shaped Curved Authentic Cashew Nut (Kaju Piece) -->
  <g transform="rotate(-15 50 50)" filter="url(#glow)">
    <!-- Base Shape -->
    <path d="M 28,35 C 20,20 40,8 62,15 C 82,22 92,45 84,68 C 76,88 50,92 34,78 C 22,68 28,52 42,48 C 54,44 64,52 66,62 C 67,68 62,74 54,74 C 48,74 45,70 46,65 C 47,60 52,56 46,55 C 38,54 32,64 36,72 C 44,88 78,82 82,60 C 86,40 74,22 56,18 C 42,15 28,24 34,38 Z" fill="url(#cashewGrad)" stroke="#B37C24" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Smooth Inner Notch Highlight -->
    <path d="M 32,32 C 26,22 42,12 60,18 C 76,24 84,44 78,64 C 74,78 52,84 38,72 C 30,64 34,53 45,50 C 56,47 62,54 62,60" fill="none" stroke="url(#cashewHighlight)" stroke-width="4" stroke-linecap="round" />
    <!-- Natural Kernel Texture Grooves -->
    <path d="M 40,25 C 50,22 65,28 72,38" fill="none" stroke="#D19E45" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M 46,30 C 55,29 68,36 72,48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.7" />
    <!-- Tip Head Shadow -->
    <path d="M 28,35 C 24,28 32,18 42,16 C 36,22 32,30 35,36 Z" fill="url(#cashewShadow)" opacity="0.5" />
  </g>
</svg>
